<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Starfall Vengeance</title>
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <script src="poki-platform-bridge.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:#03050d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
    #game-container{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03050d}
    canvas#canvas{display:block;width:100vw;height:100vh;touch-action:none;outline:none}
    #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#03050d;color:#9fdcff;z-index:999;transition:opacity .5s,visibility .5s}
    #boot.hidden{opacity:0;visibility:hidden;pointer-events:none}.boot-card{text-align:center;padding:30px}.boot-title{font:900 32px Arial;letter-spacing:4px;color:#4dc2ff;margin-bottom:8px}.boot-status{font:13px Arial;color:#7bbcd9;min-height:18px}.bar{width:280px;height:6px;margin:0 auto 14px;background:#142033;border-radius:3px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#0788ff,#00ffcc);transition:width .2s}
  </style>
</head>
<body>
  <div id="boot"><div class="boot-card"><div class="boot-title">STARFALL VENGEANCE</div><div class="bar"><div id="boot-bar" class="fill"></div></div><div id="boot-status" class="boot-status">INITIALIZING SYSTEMS…</div></div></div>
  <div id="game-container"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
<script>
(function(){
  function hideBoot(){var b=document.getElementById('boot');if(b&&!b.classList.contains('hidden')){b.classList.add('hidden');window.StarfallPlatform&&window.StarfallPlatform.loadingFinished&&window.StarfallPlatform.loadingFinished();}}
  window.addEventListener('keydown',function(e){if([32,37,38,39,40].indexOf(e.keyCode)!==-1)e.preventDefault();},false);
  window.Module={
    arguments:['/home/web_user/love/game.love'],
    INITIAL_MEMORY:134217728,
    canvas:document.getElementById('canvas'),
    print:function(text){
      if(typeof text==='string'&&text.indexOf('[PORTAL]:')===0){var rest=text.substring(9),i=rest.indexOf(':'),cmd=i<0?rest:rest.substring(0,i),arg=i<0?'':rest.substring(i+1);if(window.StarfallPlatform&&typeof window.StarfallPlatform[cmd]==='function')window.StarfallPlatform[cmd](arg);if(cmd==='loadingFinished'||cmd==='ready')hideBoot();return;}
      if(typeof text==='string'&&(text.indexOf('Error:')>-1||text.indexOf('[LUA ERROR]')>-1)){var s=document.getElementById('boot-status');if(s)s.textContent='ENGINE ERROR: '+text.substring(0,120);}console.log(text);
    },
    printErr:function(text){console.error(text);if(typeof text==='string'&&text.indexOf('Error:')>-1){var s=document.getElementById('boot-status');if(s)s.textContent='ENGINE ERROR: '+text.substring(0,120);}},
    postRun:[function(){hideBoot();}],
    monitorRunDependencies:function(left){var bar=document.getElementById('boot-bar');if(bar&&this.totalDependencies){bar.style.width=Math.round((1-left/this.totalDependencies)*100)+'%';}else if(bar&&left===0)bar.style.width='100%';}
  };
  window.Module.preRun=[function(){try{if(Module.FS){try{Module.FS.mkdir('/home')}catch(e){}try{Module.FS.mkdir('/home/web_user')}catch(e){}try{Module.FS.mkdir('/home/web_user/love')}catch(e){}}}catch(e){}}];
  function applicationLoad(){if(window._starfallLoveStarted)return;window._starfallLoveStarted=true;if(typeof Love==='function'){var p=Love(Module);if(p&&p.then)p.then(hideBoot).catch(function(e){console.error(e);});}else{var s=document.getElementById('boot-status');if(s)s.textContent='ENGINE SCRIPT ERROR: love.js failed to load';}}
</script>
<script src="game.js"></script>
<script src="love.js" onload="applicationLoad()"></script>
<script>setTimeout(function(){if(!window._starfallLoveStarted)applicationLoad();},0);</script>
</body>
</html>
